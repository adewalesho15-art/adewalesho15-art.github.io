<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Adewale Shorunke</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
body { background:#0f172a; color:#e2e8f0; line-height:1.7; padding:20px; }
.container { max-width:850px; margin:0 auto; }
a { color:#38bdf8; text-decoration:none; }
.top-nav { margin-bottom:20px; }
.top-nav a { background:#1e293b; border:1px solid #334155; padding:8px 16px; border-radius:8px; color:#e2e8f0; font-weight:600; }
.cv-card { background:#1e293b; border-radius:16px; padding:36px; border:1px solid #334155; }
.header { text-align:center; border-bottom:1px solid #334155; padding-bottom:24px; margin-bottom:24px; }
.header h1 { font-size:2.2rem; color:#fff; font-weight:800; }
.header p { color:#94a3b8; margin-top:6px; }
.contact { margin-top:12px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; font-size:0.9rem; }
.section { margin:28px 0; }
.section h2 { font-size:1.2rem; color:#fff; border-left:4px solid #fff; padding-left:12px; margin-bottom:14px; }
.item { background:#0f172a; border:1px solid #334155; border-radius:10px; padding:16px; margin:10px 0; }
.item h3 { color:#fff; font-size:1rem; }
.item .meta { color:#94a3b8; font-size:0.85rem; margin:4px 0 8px; }
.item p, .item li { color:#cbd5e1; font-size:0.95rem; }
ul { margin-left:18px; }
.skill-tag { display:inline-block; background:#0f172a; border:1px solid #334155; padding:6px 12px; border-radius:20px; font-size:0.85rem; margin:4px; }
</style>
